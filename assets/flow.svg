<ellipse class="fb" cx="1020.0" cy="225.0" rx="320" ry="210" fill="url(#glowB)"/>
<text x="600" y="48" text-anchor="middle" font-size="15" fill="#8d97b0" letter-spacing="2">HOW IT WORKS</text>
