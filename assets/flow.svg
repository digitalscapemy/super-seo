@keyframes k5{0%{opacity:0}37.33%{opacity:0}41.33%{opacity:1}54.67%{opacity:1}58.67%{opacity:0}100%{opacity:0}}.k5{animation:k5 7.5s linear infinite}
@keyframes k6{0%{opacity:0}50.67%{opacity:0}52.67%{opacity:1}57.33%{opacity:1}59.33%{opacity:0}100%{opacity:0}}.k6{animation:k6 7.5s linear infinite}
@keyframes k7{0%{opacity:0}53.33%{opacity:0}57.33%{opacity:1}70.67%{opacity:1}74.67%{opacity:0}100%{opacity:0}}.k7{animation:k7 7.5s linear infinite}
@keyframes k8{0%{opacity:0}66.67%{opacity:0}68.67%{opacity:1}73.33%{opacity:1}75.33%{opacity:0}100%{opacity:0}}.k8{animation:k8 7.5s linear infinite}
@keyframes k9{0%{opacity:0}69.33%{opacity:0}73.33%{opacity:1}86.67%{opacity:1}90.67%{opacity:0}100%{opacity:0}}.k9{animation:k9 7.5s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important} .initial{opacity:0!important} .final{opacity:1!important;transform:none!important}}
</style>
