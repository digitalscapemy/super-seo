<style>
text{font-family:'Trebuchet MS', 'Segoe UI', Verdana, Arial, sans-serif} .h{font-family:Impact, 'Arial Black', 'Helvetica Neue', Arial, sans-serif;letter-spacing:.5px} .m{font-family:ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes flap{0%,100%{transform:skewX(0deg) scaleX(1)}50%{transform:skewX(-7deg) scaleX(1.06)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes jitter{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(1px,-1px) rotate(-1deg)}75%{transform:translate(-1px,1px) rotate(1deg)}}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box}
.eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
.cape{animation:flap .7s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
.jit{animation:jitter .35s steps(2) infinite;transform-box:fill-box;transform-origin:center}
@keyframes a1{0.0%{transform:scale(0);opacity:0}3.0%{transform:scale(0);opacity:0}4.8%{transform:scale(1.25);opacity:1}6.2%{transform:scale(1);opacity:1}94.0%{transform:scale(1);opacity:1}96.0%{transform:scale(0);opacity:0}100.0%{transform:scale(0);opacity:0}}.a1{animation:a1 10.0s linear infinite;transform-box:fill-box;transform-origin:center;}
@keyframes a2{0.0%{opacity:0}6.0%{opacity:0}8.0%{opacity:1}94.0%{opacity:1}97.0%{opacity:0}100.0%{opacity:0}}.a2{animation:a2 10.0s linear infinite;}
@keyframes a3{0.0%{opacity:0}20.0%{opacity:0}22.0%{opacity:1}94.0%{opacity:1}97.0%{opacity:0}100.0%{opacity:0}}.a3{animation:a3 10.0s linear infinite;}
@keyframes a4{0.0%{opacity:0}34.0%{opacity:0}36.0%{opacity:1}94.0%{opacity:1}97.0%{opacity:0}100.0%{opacity:0}}.a4{animation:a4 10.0s linear infinite;}
@keyframes a5{0.0%{opacity:0}46.0%{opacity:0}48.0%{opacity:1}94.0%{opacity:1}97.0%{opacity:0}100.0%{opacity:0}}.a5{animation:a5 10.0s linear infinite;}
@keyframes a6{0.0%{opacity:0}56.0%{opacity:0}58.0%{opacity:1}94.0%{opacity:1}97.0%{opacity:0}100.0%{opacity:0}}.a6{animation:a6 10.0s linear infinite;}
@keyframes a7{0.0%{transform:scale(0);opacity:0}62.0%{transform:scale(0);opacity:0}63.8%{transform:scale(1.25);opacity:1}65.2%{transform:scale(1);opacity:1}94.0%{transform:scale(1);opacity:1}96.0%{transform:scale(0);opacity:0}100.0%{transform:scale(0);opacity:0}}.a7{animation:a7 10.0s linear infinite;transform-box:fill-box;transform-origin:center;}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.i0{opacity:0!important}.i1{opacity:1!important;transform:none!important}}
</style>
