<circle cx="80.0" cy="118" r="14" fill="url(#acc)"/><text x="80.0" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0f1f">1</text>
<text x="104.0" y="124" font-size="17" font-weight="700" fill="#e8ebf4">Scan code</text>
<text x="72.0" y="164" font-size="14" fill="#8d97b0">framework, routes, leaks</text>
<line x1="250.0" y1="138" x2="272.0" y2="138" stroke="#26324f" stroke-width="2"/>
<circle class="k2" cx="261.0" cy="138" r="4" fill="#22d3ee" opacity="0"/>
