<circle cx="96" cy="51" r="7" fill="#3fbf4f" stroke="#141414" stroke-width="3"/>
<text class="h" x="600" y="60" text-anchor="middle" font-size="20" fill="#141414">MISSION LOG · /super-seo</text>
<text class="m a1 i1" x="56" y="102" font-size="15" fill="#7CFC8A">$ claude  →  /super-seo</text>
<text class="m a2 i1" x="56" y="132" font-size="15" fill="#9aa4b8">▸ baseline   audit.py · nextjs · 42 routes · 38 pages crawled</text>
<text class="m a3 i1" x="56" y="162" font-size="15" fill="#7fd8ff">▸ squad      code · technical · geo · content · schema · speed · rivals   (parallel)</text>
<text class="m a4 i1" x="56" y="192" font-size="15" fill="#ff7b72">✖ critical   /pricing renders prices client-side (AI bots see none)</text>
<text class="m a5 i1" x="56" y="222" font-size="15" fill="#ffb86b">▲ high       metadataBase missing · 6 routes inherit one title</text>
<text class="m a6 i1" x="56" y="252" font-size="15" fill="#ffb86b">▲ high       Cloudflare managed robots blocks GPTBot, ClaudeBot</text>
<text class="m a7 i1" x="56" y="282" font-size="15" fill="#ffe66d">● medium     no SoftwareApplication schema · 3 orphan pages</text>
<text class="m a8 i1" x="56" y="312" font-size="15" fill="#7fd8ff">▸ fixer ×3   12 files changed · build ok · re-crawl ok</text>
<text class="h" x="56" y="378" font-size="20" fill="#fff">READINESS</text>
<rect x="180" y="358" width="600" height="26" rx="6" fill="#262b3a" stroke="#000" stroke-width="2"/>
