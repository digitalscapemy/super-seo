@keyframes a3{0.0%{transform:scale(0);opacity:0}26.67%{transform:scale(0);opacity:0}29.67%{transform:scale(1.25);opacity:1}32.0%{transform:scale(1);opacity:1}93.33%{transform:scale(1);opacity:1}96.67%{transform:scale(0);opacity:0}100.0%{transform:scale(0);opacity:0}}.a3{animation:a3 6.0s linear infinite;transform-box:fill-box;transform-origin:center;}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.i0{opacity:0!important}.i1{opacity:1!important;transform:none!important}}
</style>
