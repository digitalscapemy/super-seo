<pattern id="dotsB" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#2b7de9"/><circle cx="4.5" cy="4.5" r="2.2" fill="#1b4fa8" fill-opacity="0.6"/></pattern>
<pattern id="dotsR" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#ee3b34"/><circle cx="4.5" cy="4.5" r="2.2" fill="#a8201b" fill-opacity="0.55"/></pattern>
<pattern id="dotsC" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#19c2b0"/><circle cx="4.5" cy="4.5" r="2.1" fill="#0d7d72" fill-opacity="0.5"/></pattern>
</defs>
<style>
text{font-family:'Trebuchet MS', 'Segoe UI', Verdana, Arial, sans-serif} .h{font-family:Impact, 'Arial Black', 'Helvetica Neue', Arial, sans-serif;letter-spacing:.5px} .m{font-family:ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes flap{0%,100%{transform:skewX(0deg) scaleX(1)}50%{transform:skewX(-7deg) scaleX(1.06)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes jitter{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(1px,-1px) rotate(-1deg)}75%{transform:translate(-1px,1px) rotate(1deg)}}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box}
.eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
.cape{animation:flap .7s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
.jit{animation:jitter .35s steps(2) infinite;transform-box:fill-box;transform-origin:center}
@keyframes a1{0.0%{opacity:0;transform:translateX(-14px)}4.62%{opacity:0;transform:translateX(-14px)}6.54%{opacity:1;transform:translateX(0)}95.38%{opacity:1;transform:translateX(0)}97.69%{opacity:0}100.0%{opacity:0}}.a1{animation:a1 13.0s linear infinite;}
@keyframes a2{0.0%{opacity:0;transform:translateX(-14px)}10.77%{opacity:0;transform:translateX(-14px)}12.69%{opacity:1;transform:translateX(0)}95.38%{opacity:1;transform:translateX(0)}97.69%{opacity:0}100.0%{opacity:0}}.a2{animation:a2 13.0s linear infinite;}
@keyframes a3{0.0%{opacity:0;transform:translateX(-14px)}16.92%{opacity:0;transform:translateX(-14px)}18.85%{opacity:1;transform:translateX(0)}95.38%{opacity:1;transform:translateX(0)}97.69%{opacity:0}100.0%{opacity:0}}.a3{animation:a3 13.0s linear infinite;}
@keyframes a4{0.0%{opacity:0;transform:translateX(-14px)}24.62%{opacity:0;transform:translateX(-14px)}26.54%{opacity:1;transform:translateX(0)}95.38%{opacity:1;transform:translateX(0)}97.69%{opacity:0}100.0%{opacity:0}}.a4{animation:a4 13.0s linear infinite;}
@keyframes a5{0.0%{opacity:0;transform:translateX(-14px)}28.46%{opacity:0;transform:translateX(-14px)}30.38%{opacity:1;transform:translateX(0)}95.38%{opacity:1;transform:translateX(0)}97.69%{opacity:0}100.0%{opacity:0}}.a5{animation:a5 13.0s linear infinite;}
@keyframes a6{0.0%{opacity:0;transform:translateX(-14px)}32.31%{opacity:0;transform:translateX(-14px)}34.23%{opacity:1;transform:translateX(0)}95.38%{opacity:1;transform:translateX(0)}97.69%{opacity:0}100.0%{opacity:0}}.a6{animation:a6 13.0s linear infinite;}
@keyframes a7{0.0%{opacity:0;transform:translateX(-14px)}36.15%{opacity:0;transform:translateX(-14px)}38.08%{opacity:1;transform:translateX(0)}95.38%{opacity:1;transform:translateX(0)}97.69%{opacity:0}100.0%{opacity:0}}.a7{animation:a7 13.0s linear infinite;}
@keyframes a8{0.0%{opacity:0;transform:translateX(-14px)}43.08%{opacity:0;transform:translateX(-14px)}45.0%{opacity:1;transform:translateX(0)}95.38%{opacity:1;transform:translateX(0)}97.69%{opacity:0}100.0%{opacity:0}}.a8{animation:a8 13.0s linear infinite;}
@keyframes a9{0.0%{transform:scaleX(.42)}47.69%{transform:scaleX(.42)}56.92%{transform:scaleX(.95)}95.38%{transform:scaleX(.95)}97.69%{transform:scaleX(.42)}100.0%{transform:scaleX(.42)}}.a9{animation:a9 13.0s cubic-bezier(.2,.9,.3,1.2) infinite;}
@keyframes a10{0.0%{opacity:0}0.0%{opacity:0}1.92%{opacity:1}50.77%{opacity:1}52.69%{opacity:0}100.0%{opacity:0}}.a10{animation:a10 13.0s linear infinite;}
@keyframes a11{0.0%{transform:scale(0);opacity:0}56.92%{transform:scale(0);opacity:0}58.31%{transform:scale(1.25);opacity:1}59.38%{transform:scale(1);opacity:1}95.38%{transform:scale(1);opacity:1}96.92%{transform:scale(0);opacity:0}100.0%{transform:scale(0);opacity:0}}.a11{animation:a11 13.0s linear infinite;transform-box:fill-box;transform-origin:center;}
@keyframes a12{0.0%{transform:scale(0);opacity:0}61.54%{transform:scale(0);opacity:0}62.92%{transform:scale(1.25);opacity:1}64.0%{transform:scale(1);opacity:1}95.38%{transform:scale(1);opacity:1}96.92%{transform:scale(0);opacity:0}100.0%{transform:scale(0);opacity:0}}.a12{animation:a12 13.0s linear infinite;transform-box:fill-box;transform-origin:center;}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.i0{opacity:0!important}.i1{opacity:1!important;transform:none!important}}
</style>
