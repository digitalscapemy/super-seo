<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
<title id="t">super-seo audit in the terminal</title><desc id="d">Example terminal session: the audit command is typed, the code scan, crawl and AI access checks pass, and readiness bars fill up to a 93 out of 100 score with no critical issues.</desc>
