<circle cx="306.0" cy="118" r="14" fill="url(#acc)"/><text x="306.0" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0f1f">2</text>
<text x="330.0" y="124" font-size="17" font-weight="700" fill="#e8ebf4">Crawl localhost</text>
<text x="298.0" y="164" font-size="14" fill="#8d97b0">before you deploy</text>
<line x1="476.0" y1="138" x2="498.0" y2="138" stroke="#26324f" stroke-width="2"/>
<circle class="k4" cx="487.0" cy="138" r="4" fill="#22d3ee" opacity="0"/>
<rect x="502.0" y="86" width="196" height="104" rx="14" fill="#121b31" stroke="#26324f"/>
<rect class="k5" x="502.0" y="86" width="196" height="104" rx="14" fill="none" stroke="url(#acc)" stroke-width="2" opacity="0"/>
<circle cx="532.0" cy="118" r="14" fill="url(#acc)"/><text x="532.0" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0f1f">3</text>
<text x="556.0" y="124" font-size="17" font-weight="700" fill="#e8ebf4">AI access</text>
<text x="524.0" y="164" font-size="14" fill="#8d97b0">bots, WAF, llms.txt</text>
<line x1="702.0" y1="138" x2="724.0" y2="138" stroke="#26324f" stroke-width="2"/>
<circle class="k6" cx="713.0" cy="138" r="4" fill="#22d3ee" opacity="0"/>
