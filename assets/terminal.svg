<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
<title id="t">A super-seo run</title><desc id="d">A comic-framed terminal: /super-seo runs a baseline, sends the specialist squad in parallel, lists critical, high and medium findings, the fixer agents change 12 files, and readiness jumps from 42 to 95 with zero criticals left.</desc>
