<circle cx="758.0" cy="118" r="14" fill="url(#acc)"/><text x="758.0" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0f1f">4</text>
<text x="782.0" y="124" font-size="17" font-weight="700" fill="#e8ebf4">Fix in code</text>
<text x="750.0" y="164" font-size="14" fill="#8d97b0">metadata, schema, SSR</text>
<line x1="928.0" y1="138" x2="950.0" y2="138" stroke="#26324f" stroke-width="2"/>
<circle class="k8" cx="939.0" cy="138" r="4" fill="#22d3ee" opacity="0"/>
<rect x="954.0" y="86" width="196" height="104" rx="14" fill="#121b31" stroke="#26324f"/>
<rect class="k9" x="954.0" y="86" width="196" height="104" rx="14" fill="none" stroke="url(#acc)" stroke-width="2" opacity="0"/>
<circle cx="984.0" cy="118" r="14" fill="url(#acc)"/><text x="984.0" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0f1f">5</text>
<text x="1008.0" y="124" font-size="17" font-weight="700" fill="#e8ebf4">Gate releases</text>
<text x="976.0" y="164" font-size="14" fill="#8d97b0">CI + drift</text>
<text x="600" y="226" text-anchor="middle" font-size="13" fill="#8d97b0">One command: python scripts/audit.py --path . --url http://localhost:3000</text>
</g>
<rect x="0.5" y="0.5" width="1199" height="249" rx="18" fill="none" stroke="#26324f"/>
