<g class="a12 i1"><g class=""><polygon points="964,366 950,388 986,366" fill="#c9ffd2" stroke="#141414" stroke-width="3.5" stroke-linejoin="round"/><rect x="940" y="326" width="200" height="40" rx="20.0" fill="#c9ffd2" stroke="#141414" stroke-width="3.5"/><polygon points="967,364 983,364 967,369" fill="#c9ffd2"/><text x="1040.0" y="351.4" text-anchor="middle" font-size="15" font-weight="700" fill="#141414">0 criticals left</text></g></g>
<text x="56" y="418" font-size="12" fill="#9aa4b8">illustrative run · report saved to .seo/reports/</text>
